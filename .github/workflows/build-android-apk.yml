name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "src/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase Android app
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" || {
            echo "::error::Set the FIREBASE_GOOGLE_SERVICES_JSON_BASE64 Actions secret from the Firebase Android app configuration."
            exit 1
          }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node -e "const c=require('./android/app/google-services.json'); if (!c.client?.some(x => x.client_info?.android_client_info?.package_name === 'com.rgsunityhub.app')) process.exit(1)"

      - name: Build web assets and sync Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rgs-unity-hub.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rgs-unity-hub-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android APK build ${{ github.run_number }}
          body: |
            APK Android terbaru untuk RGS Unity Hub.

            Unduh `rgs-unity-hub.apk`, lalu buka file tersebut di perangkat Android untuk memasang atau memperbarui aplikasi.
          files: rgs-unity-hub.apk
          make_latest: true
          fail_on_unmatched_files: true
